services:
  tvbox-manager:
    build: .
    image: tvbox-manager:latest
    container_name: tvbox-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      TOKEN: 请改成你自己的令牌
      CHECK_INTERVAL: "360"
      CHECK_CONCURRENCY: "10"
      INSECURE_TLS: "true"
      USER_AGENT: okhttp/4.9.1
      STARTUP_CHECK: "false"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
