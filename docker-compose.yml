services:
  tvbox-manager:
    # 直接从阿里云镜像仓库拉取，不在本地构建。
    # 需要自己从源码构建时：注释掉 image，改用下面的 build。
    image: registry.cn-hangzhou.aliyuncs.com/qdjzw/jiuseng:latest
    # build: .
    container_name: tvbox-manager
    restart: unless-stopped
    ports:
      # 冒号左边是宿主机端口（对外访问用，随意改）；右边是容器内端口，必须等于下面的 PORT
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai

      # —— 以下为「首次启动的初始值」——
      # 只在 data/config.json 里还没有该项时生效，落盘后以配置文件为准：
      #   端口 / 订阅路径 → 后台「设置」页改；令牌 → 「设置 → 访问令牌」页改（立即生效），
      #   或改 data/config.json 的 token 字段后重启
      # 想让环境变量强制覆盖，取消最后一行注释。
      # TOKEN 不设置（保持注释）= 无鉴权模式：后台不校验令牌，登录页可直接进入并提示设置
      # TOKEN: 请改成你自己的令牌
      PORT: "8080"
      SUB_PATH: /sub

      # —— 探活相关，同样只在首次启动写入配置 ——
      CHECK_INTERVAL: "360"
      CHECK_CONCURRENCY: "10"
      INSECURE_TLS: "true"
      STARTUP_CHECK: "false"

      # ENV_OVERRIDE: "1"   # 打开后环境变量重新变为最高优先级
    volumes:
      # 命名卷：首次挂载自动继承镜像内 /data 的属主（app 用户，uid=100），
      # 不存在 bind 挂载的属主/SELinux 问题。
      # 卷名已在文件末尾用 name 固定，实际落在 /var/lib/docker/volumes/tvbox-data/_data
      # 想改回明文目录挂载用：- ./data:/data
      # （需先 mkdir -p ./data && chown -R 100:101 ./data，CentOS 还可能要加 :z）
      - tvbox-data:/data
    healthcheck:
      # $$ 是 compose 的转义，交给容器内的 sh 展开，这样改 PORT 后健康检查跟着走。
      # 若写成单个 $ 会被 compose 在启动时插值（只看 .env / 宿主环境，不看下面的 environment），
      # 结果永远是 8080，改了 PORT 就会误报 unhealthy。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # 显式固定卷名，避免 docker compose 自动加项目名前缀
  # （默认会变成 <所在目录名>_tvbox-data，与手工创建的 tvbox-data 不是同一个卷，
  #   迁移过数据时会出现「容器起来了但读空卷」的现象）
  tvbox-data:
    name: tvbox-data
